version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: anidoki_meilisearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256Mb
    volumes:
      - anidoki_meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: anidoki_redis_cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - anidoki_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: anidoki_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: anidoki_db
      POSTGRES_USER: anidoki_user
      POSTGRES_PASSWORD: anidoki_secure_pass_2026
    ports:
      # Ánh xạ ra cổng 5438 ở máy chủ để tránh xung đột với cổng 5432 / 5433 của dự án khác
      - "5438:5432"
    volumes:
      - anidoki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anidoki_user -d anidoki_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  anidoki_meili_data:
    driver: local
  anidoki_redis_data:
    driver: local
  anidoki_pgdata:
    driver: local
